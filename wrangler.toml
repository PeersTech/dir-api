name = "dir-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# D1 database: create once, paste the id here
#   npx wrangler d1 create dir-api
[[d1_databases]]
binding = "DB"
database_name = "dir-api"
database_id = "REPLACE_ME"

# Prune expired nonces + long-dead nodes twice an hour
[triggers]
crons = ["*/30 * * * *"]

# Custom domain — peers.dpdns.org IS a Cloudflare zone, so this attaches
# with zero extra DNS work. After first deploy run once:
#   npx wrangler deploy   (then confirm the domain in dashboard → Workers → dir-api → Domains)
routes = [{ pattern = "directory.peers.dpdns.org", custom_domain = true }]

[observability]
enabled = true
